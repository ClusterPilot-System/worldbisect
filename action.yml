# Implementations are immutable pins; see docs/marketplace.md before updating.
name: WorldBisect CI Diagnosis
description: Keep safe successful CI inputs and test why a later Linux check fails; also compare explicit workspaces
author: ClusterPilot System
branding:
  color: blue
  icon: search
inputs:
  mode:
    description: ci saves safe successful inputs automatically; compare preserves the existing explicit-workspace interface
    default: compare
  command:
    description: 'ci: JSON argument array; compare: executable and whitespace-separated arguments'
    required: true
  good-workspace:
    description: 'compare mode only: Workspace path relative to GITHUB_WORKSPACE representing the known-good world'
    required: false
    default: ''
  bad-workspace:
    description: 'compare mode only: Workspace path relative to GITHUB_WORKSPACE representing the known-bad world'
    required: false
    default: ''
  version:
    description: WorldBisect release version without the leading v
    required: false
    default: '1.2.0'
  sha256:
    description: Optional SHA-256 of the selected archive. Defaults to the verified official v1.2.0 digest for the runner architecture.
    required: false
    default: ''
  repository:
    description: Release repository containing the verified WorldBisect archive
    required: false
    default: ClusterPilot-System/worldbisect
  oracle:
    description: Failure oracle passed to WorldBisect capture
    required: false
    default: exit=0
  repetitions:
    description: Number of repeated experiments per factor
    required: false
    default: '3'
  max-experiments:
    description: Maximum number of experiments allowed during analysis
    required: false
    default: '128'
  fail-on:
    description: Policy that makes the action fail after artifacts are uploaded
    required: false
    default: never
  report-url:
    description: Optional stable report URL embedded in JUnit and SARIF metadata
    required: false
    default: ''
  bundle-url:
    description: Optional stable diagnostic-bundle URL embedded in JUnit and SARIF metadata
    required: false
    default: ''
  artifact-name:
    description: GitHub Actions artifact name for the report and evidence files
    required: false
    default: worldbisect-diagnostic
  comment-pr:
    description: Update one PR comment with the redacted diagnosis summary (same-repository pull requests only)
    required: false
    default: 'false'
  github-token:
    description: Optional GitHub token for the PR comment and report checks; defaults to the workflow token
    required: false
    default: ''
  files:
    description: 'ci mode only: Explicit relative regular file paths, one per line. Contents are retained unredacted; select only safe inputs.'
    required: false
    default: ''
  baseline-key:
    description: 'ci mode only: Stable unique identifier for this check and matrix variant within the job'
    default: default
    required: false
  retention-days:
    description: 'ci mode only: Maximum baseline age and artifact retention (1-30 days)'
    default: '7'
    required: false
  timeout-seconds:
    description: 'ci mode only: Timeout for each command execution (1-600 seconds)'
    default: '60'
    required: false
  diagnostic-timeout-seconds:
    description: 'ci mode only: Total compare budget in seconds (1-900); the command failure is preserved on timeout'
    default: '180'
    required: false
outputs:
  status:
    description: CI outcome or bounded WorldBisect analysis status
    value: ${{ steps.ci.outputs.status || steps.compare.outputs.status }}
  analysis-id:
    description: Stable WorldBisect analysis identifier
    value: ${{ steps.ci.outputs.analysis-id || steps.compare.outputs.analysis-id }}
  report-path:
    description: Markdown report path in the uploaded artifact
    value: ${{ steps.compare.outputs.report-path }}
  bundle-path:
    description: Redacted diagnostic bundle path in the uploaded artifact
    value: ${{ steps.compare.outputs.bundle-path }}
  report-artifact-url:
    description: Direct URL to the uploaded Markdown report artifact
    value: ${{ steps.compare.outputs.report-artifact-url }}
  artifact-url:
    description: Direct URL to the uploaded diagnostic evidence artifact
    value: ${{ steps.ci.outputs.artifact-url || steps.compare.outputs.artifact-url }}
  artifact-id:
    description: GitHub artifact ID for the diagnostic evidence
    value: ${{ steps.compare.outputs.artifact-id }}
  artifact-digest:
    description: SHA-256 digest of the uploaded diagnostic evidence artifact
    value: ${{ steps.compare.outputs.artifact-digest }}
  junit-path:
    description: Local JUnit report path for a test-report check publisher
    value: ${{ steps.compare.outputs.junit-path }}
  sarif-path:
    description: Local SARIF report path for Code Scanning upload
    value: ${{ steps.compare.outputs.sarif-path }}
  baseline-run-id:
    description: 'ci mode: selected trusted successful workflow run'
    value: ${{ steps.ci.outputs.baseline-run-id }}
runs:
  using: composite
  steps:
  - name: Validate Action mode
    shell: bash
    env:
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_COMMAND: ${{ inputs.command }}
      INPUT_FILES: ${{ inputs.files }}
      INPUT_GOOD_WORKSPACE: ${{ inputs.good-workspace }}
      INPUT_BAD_WORKSPACE: ${{ inputs.bad-workspace }}
      INPUT_REPOSITORY: ${{ inputs.repository }}
      INPUT_FAIL_ON: ${{ inputs.fail-on }}
    run: python3 "$GITHUB_ACTION_PATH/scripts/validate-action-mode.py"
  - name: Run automatic CI diagnosis
    id: ci
    if: inputs.mode == 'ci'
    uses: ClusterPilot-System/worldbisect/actions/ci@e05d1b12304674ce6c79d0b93828e833e6419bdd
    with:
      command: ${{ inputs.command }}
      files: ${{ inputs.files }}
      baseline-key: ${{ inputs.baseline-key }}
      retention-days: ${{ inputs.retention-days }}
      timeout-seconds: ${{ inputs.timeout-seconds }}
      diagnostic-timeout-seconds: ${{ inputs.diagnostic-timeout-seconds }}
      comment-pr: ${{ inputs.comment-pr }}
      version: ${{ inputs.version }}
      sha256: ${{ inputs.sha256 }}
  - name: Compare explicit workspaces
    id: compare
    if: inputs.mode == 'compare'
    uses: ClusterPilot-System/worldbisect/actions/compare@e05d1b12304674ce6c79d0b93828e833e6419bdd
    with:
      command: ${{ inputs.command }}
      good-workspace: ${{ inputs.good-workspace }}
      bad-workspace: ${{ inputs.bad-workspace }}
      version: ${{ inputs.version }}
      sha256: ${{ inputs.sha256 }}
      repository: ${{ inputs.repository }}
      oracle: ${{ inputs.oracle }}
      repetitions: ${{ inputs.repetitions }}
      max-experiments: ${{ inputs.max-experiments }}
      fail-on: ${{ inputs.fail-on }}
      report-url: ${{ inputs.report-url }}
      bundle-url: ${{ inputs.bundle-url }}
      artifact-name: ${{ inputs.artifact-name }}
      comment-pr: ${{ inputs.comment-pr }}
      github-token: ${{ inputs.github-token }}
