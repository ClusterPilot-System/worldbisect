name: User report (sanitized)
description: Share a consented, anonymized real-world WorldBisect result
title: "[User report]: "
labels: ["case-study", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing a real-world result. This form is not a private support channel.
        Do not include names, organizations, repository URLs, hostnames, credentials, private paths,
        command arguments, raw logs, workspace contents, customer data, or other identifying details.
        Use GitHub private vulnerability reporting for security-sensitive or confidential incidents.
  - type: checkboxes
    id: consent
    attributes:
      label: Publication consent
      description: A maintainer may derive an anonymized public case study from this report after review.
      options:
        - label: I have authority to share this sanitized account and consent to anonymized publication.
          required: true
        - label: I understand that the source evidence will not be published and may be requested privately for verification.
          required: true
  - type: input
    id: version
    attributes:
      label: WorldBisect version
      placeholder: 1.2.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Linux distribution and architecture
      placeholder: Debian 13, linux/amd64
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result status
      options:
        - PROVEN
        - SUPPORTED
        - CORRELATED
        - UNPROVEN
        - operational failure
    validations:
      required: true
  - type: textarea
    id: sanitized-symptom
    attributes:
      label: Sanitized symptom and outcome
      description: Describe the failure, what changed between the good and bad worlds, and the safe next action.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence summary
      description: Include only high-level evidence. Never paste captures, reports with private fields, raw logs, or command output.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety review
      options:
        - label: I removed secrets, personal data, private infrastructure details, customer information, and proprietary artifacts.
          required: true
        - label: I understand that maintainers may request private verification or decline publication if the case cannot be safely anonymized.
          required: true
