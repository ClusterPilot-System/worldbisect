name: Publish exact verified WorldBisect source v1.0.0 (idempotent)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/exact-source-publish-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write

concurrency:
  group: worldbisect-exact-v1-publication-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPOSITORY: ClusterPilot-System/worldbisect
      RELEASE_TAG: v1.0.0
      SOURCE_SHA256: 20f0cb9a4262fe270073f1283f77a22488df6849f08caf145d0a16949bf1ce01
      SOURCE_DATE_EPOCH: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Acquire exact source from authenticated digest
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f /tmp/worldbisect-source.zip
          urls=(
            "https://worldbisect-source-20260818.serveo.net/worldbisect-v1.0.0-final-source.zip"
            "https://worldbisect-source-20260818.loca.lt/worldbisect-v1.0.0-final-source.zip"
          )
          for url in "${urls[@]}"; do
            rm -f /tmp/candidate.zip
            if curl --fail-with-body --location --retry 5 --retry-all-errors \
              --connect-timeout 15 --max-time 240 \
              -H 'bypass-tunnel-reminder: true' \
              --output /tmp/candidate.zip "${url}"; then
              actual=$(sha256sum /tmp/candidate.zip | awk '{print $1}')
              if [[ "${actual}" == "${SOURCE_SHA256}" ]]; then
                mv /tmp/candidate.zip /tmp/worldbisect-source.zip
                echo "Verified exact source from ${url}"
                break
              fi
              echo "Digest mismatch from ${url}: ${actual}" >&2
            fi
          done
          test -f /tmp/worldbisect-source.zip || { echo 'No source endpoint returned the authenticated archive' >&2; exit 1; }
          printf '%s  %s\n' "${SOURCE_SHA256}" /tmp/worldbisect-source.zip | sha256sum -c -
          rm -rf /tmp/worldbisect-source
          unzip -q /tmp/worldbisect-source.zip -d /tmp/worldbisect-source
          test -d /tmp/worldbisect-source/worldbisect-1.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.x"
          cache: false

      - name: Verify, test, and build exact source
        shell: bash
        working-directory: /tmp/worldbisect-source/worldbisect-1.0.0
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh scripts/*.py examples/*/*.sh packaging/debian/postinst
          test "$(find . -type f | wc -l)" -ge 120
          test "$(cat VERSION)" = "1.0.0"
          grep -qx 'module github.com/ClusterPilot-System/worldbisect' go.mod
          required=(README.md LICENSE NOTICE SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md GOVERNANCE.md MAINTAINERS.md CHANGELOG.md VERSION go.mod Makefile api/openapi.yaml docs/ARCHITECTURE.md docs/USER_GUIDE.md docs/SECURITY.md docs/THREAT_MODEL.md cmd/worldbisect/main.go cmd/worldbisectd/main.go internal/api/server.go internal/capture/capture.go internal/experiment/engine.go internal/jobs/manager.go internal/runner/runner.go internal/service/service.go internal/store/store.go internal/workspace/workspace.go web/index.html)
          for path in "${required[@]}"; do test -f "${path}" || { echo "missing ${path}" >&2; exit 1; }; done
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -count=1
          timeout --foreground 900s go test -race ./... -count=1
          timeout --foreground 300s make e2e
          timeout --foreground 1200s make release
          (cd dist && sha256sum -c SHA256SUMS)
          python3 -m json.tool dist/worldbisect-1.0.0.spdx.json >/dev/null
          for archive in dist/*.tar.gz; do
            ! tar -tzf "${archive}" | grep -Eq '(^|/)\.\.(/|$)|^/'
          done

      - name: Replace main with the complete exact source
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          src=/tmp/worldbisect-source/worldbisect-1.0.0
          rsync -a --delete --exclude=.git --exclude=dist --exclude=bin --exclude=build "${src}/" "${GITHUB_WORKSPACE}/"
          chmod +x scripts/*.sh scripts/*.py examples/*/*.sh packaging/debian/postinst
          test ! -e .bootstrap
          test ! -e .bootstrap-exact
          test "$(find . -type f ! -path './.git/*' | wc -l)" -ge 120
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Publish complete verified WorldBisect v1.0.0 source"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Create or verify immutable release tag
        shell: bash
        run: |
          set -Eeuo pipefail
          sha='${{ steps.source.outputs.sha }}'
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            target=$(git rev-list -n 1 "${RELEASE_TAG}")
            test "${target}" = "${sha}" || { echo "${RELEASE_TAG} points to ${target}, expected ${sha}" >&2; exit 1; }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" "${sha}" -m "WorldBisect v1.0.0"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: /tmp/worldbisect-source/worldbisect-1.0.0/dist/SHA256SUMS

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<'NOTES'
          # WorldBisect v1.0.0

          Initial public Apache-2.0 release of WorldBisect, Git bisect for runtime reality.

          The release includes AMD64 and ARM64 Linux archives, Debian packages, source archive, SHA-256 checksums, SPDX 2.3 SBOM, and GitHub artifact attestations.

          Scope, evidence boundaries, operational guidance, and security reporting are documented in the repository.
          NOTES
          assets=(/tmp/worldbisect-source/worldbisect-1.0.0/dist/*)
          if gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${REPOSITORY}" --clobber
            gh release edit "${RELEASE_TAG}" --repo "${REPOSITORY}" --title "WorldBisect v1.0.0" --notes-file /tmp/release-notes.md --draft=false --prerelease=false
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" --repo "${REPOSITORY}" --title "WorldBisect v1.0.0" --notes-file /tmp/release-notes.md --verify-tag
          fi

      - name: Configure repository metadata and security
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n '{description:"Git bisect for runtime reality: prove the smallest runtime factor set that makes a Linux command fail.",homepage:"https://github.com/ClusterPilot-System/worldbisect",has_issues:true,has_projects:false,has_wiki:false,has_discussions:true,allow_squash_merge:true,allow_merge_commit:false,allow_rebase_merge:false,allow_auto_merge:true,delete_branch_on_merge:true,allow_update_branch:true,web_commit_signoff_required:true}' | gh api --method PATCH "repos/${REPOSITORY}" --input - >/dev/null || true
          jq -n '{names:["linux","debugging","causal-inference","delta-debugging","reproducibility","devtools","observability","go","open-source","runtime-analysis"]}' | gh api --method PUT "repos/${REPOSITORY}/topics" --input - >/dev/null || true
          gh api --method PUT "repos/${REPOSITORY}/vulnerability-alerts" >/dev/null || true
          gh api --method PUT "repos/${REPOSITORY}/automated-security-fixes" >/dev/null || true
          gh api --method PUT "repos/${REPOSITORY}/private-vulnerability-reporting" >/dev/null || true
          jq -n '{security_and_analysis:{advanced_security:{status:"enabled"},secret_scanning:{status:"enabled"},secret_scanning_push_protection:{status:"enabled"}}}' | gh api --method PATCH "repos/${REPOSITORY}" --input - >/dev/null || true

      - name: Protect main branch when administration permission permits
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n '{required_status_checks:null,enforce_admins:true,required_pull_request_reviews:{dismissal_restrictions:{users:[],teams:[],apps:[]},dismiss_stale_reviews:true,require_code_owner_reviews:true,required_approving_review_count:1,require_last_push_approval:true},restrictions:null,required_linear_history:true,allow_force_pushes:false,allow_deletions:false,block_creations:false,required_conversation_resolution:true,lock_branch:false,allow_fork_syncing:true}' | gh api --method PUT "repos/${REPOSITORY}/branches/main/protection" --input - >/dev/null || echo 'Branch protection requires a one-time organization-admin action.'
