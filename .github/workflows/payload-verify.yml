name: Verify full WorldBisect source payload

on:
  push:
    branches:
      - bootstrap/full-source-v1.0.0
    paths:
      - '.payload/**'
      - '.github/workflows/payload-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldbisect-payload-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reconstruct and verify source archive
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t parts < <(find .payload -maxdepth 1 -type f -name 'worldbisect-source.tar.xz.b64.part-*' | LC_ALL=C sort)
          test "${#parts[@]}" -eq 8
          for index in 00 01 02 03 04 05 06 07; do
            test -f ".payload/worldbisect-source.tar.xz.b64.part-${index}"
          done
          cat "${parts[@]}" | tr -d '\r\n ' | base64 --decode > /tmp/worldbisect-source.archive
          actual="$(sha256sum /tmp/worldbisect-source.archive | awk '{print $1}')"
          expected='d774469333d5e9303fcccc398b959cdf3fff5ab4f3e5ea0c576a4bc0d6e59554'
          test "$actual" = "$expected"
          rm -rf /tmp/worldbisect-extract
          mkdir -p /tmp/worldbisect-extract
          if unzip -t /tmp/worldbisect-source.archive >/dev/null 2>&1; then
            unzip -q /tmp/worldbisect-source.archive -d /tmp/worldbisect-extract
          elif tar -tJf /tmp/worldbisect-source.archive >/dev/null 2>&1; then
            tar -xJf /tmp/worldbisect-source.archive -C /tmp/worldbisect-extract
          else
            echo 'Payload is not a supported ZIP or xz-compressed tar archive.' >&2
            exit 3
          fi
          root="$(find /tmp/worldbisect-extract -type f -name go.mod -printf '%h\n' | head -n1)"
          test -n "$root"
          test "$(find "$root" -type f | wc -l)" -eq 128
          grep -Fxq 'module github.com/ClusterPilot-System/worldbisect' "$root/go.mod"
          for path in \
            cmd/worldbisect/main.go \
            cmd/worldbisectd/main.go \
            internal/analysis/analysis.go \
            internal/api/server.go \
            internal/jobs/manager.go \
            internal/service/service.go \
            pkg/contracts/contracts.go \
            api/openapi.yaml \
            web/index.html \
            docs/ARCHITECTURE.md \
            docs/SECURITY.md \
            packaging/systemd/worldbisectd.service \
            LICENSE README.md SECURITY.md CONTRIBUTING.md; do
            test -f "$root/$path"
          done
          echo "root=$root" >> "$GITHUB_OUTPUT"
          printf 'Verified archive SHA-256: %s\n' "$actual"
          printf 'Verified source files: %s\n' "$(find "$root" -type f | wc -l)"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ steps.source.outputs.root }}/go.mod
          cache: false

      - name: Run full release gates
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.source.outputs.root }}
          SOURCE_DATE_EPOCH: '0'
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_ROOT"
          test -z "$(gofmt -l $(find . -type f -name '*.go' -not -path './vendor/*'))"
          go mod verify
          go vet ./...
          go test ./... -count=1
          go test -race ./... -count=1
          make check
          make e2e
          make release
          test -d dist
