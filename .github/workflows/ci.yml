name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify modules
        run: go mod verify
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Race detector
        run: go test -race ./... -count=1
      - name: End-to-end
        env:
          WORLDBISECT_E2E_RACE: "1"
          WORLDBISECT_E2E_ARTIFACT_DIR: build/diagnostics
        run: timeout --foreground 120s ./scripts/e2e.sh
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worldbisect-diagnostic-reports
          path: build/diagnostics
          if-no-files-found: ignore
          retention-days: 7
      - name: Release gate
        run: make check
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worldbisect-ci-failure
          path: |
            build/
            coverage.out
          if-no-files-found: ignore
          retention-days: 7

  upload-diagnostic-sarif:
    if: github.event_name != 'pull_request' && needs.validate.result == 'success'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository for Code Scanning context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download diagnostic reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: worldbisect-diagnostic-reports
          path: build/diagnostics
      - name: Prepare SARIF for Code Scanning
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("build/diagnostics/analysis.sarif")
          target = Path("build/diagnostics/github-code-scanning.sarif")
          document = json.loads(source.read_text(encoding="utf-8"))
          for run in document.get("runs", []):
              for result in run.get("results", []):
                  # WorldBisect locations identify an analysis, not a source file.
                  # GitHub Code Scanning accepts only file/relative artifact URIs,
                  # so keep the canonical SARIF unchanged and upload this
                  # analysis-level projection without a misleading file location.
                  result.pop("locations", None)
          target.write_text(json.dumps(document, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload SARIF findings
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: build/diagnostics/github-code-scanning.sarif

  arm64-runtime:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test on native ARM64
        run: |
          go test ./... -count=1
          go test -race ./... -count=1
      - name: End-to-end on native ARM64
        env:
          WORLDBISECT_E2E_RACE: "1"
        run: timeout --foreground 120s ./scripts/e2e.sh
      - name: Package and execute ARM64 release binary
        run: |
          make release
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          archive="dist/worldbisect_$(cat VERSION)_linux_arm64.tar.gz"
          tar -xzf "$archive" -C "$tmp"
          root="$tmp/worldbisect_$(cat VERSION)_linux_arm64"
          "$root/bin/worldbisect" version
          "$root/bin/worldbisectd" version
