name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify modules
        run: go mod verify
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Race detector
        run: go test -race ./... -count=1
      - name: End-to-end
        env:
          WORLDBISECT_E2E_RACE: "1"
        run: timeout --foreground 120s ./scripts/e2e.sh
      - name: Release gate
        run: make check
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worldbisect-ci-failure
          path: |
            build/
            coverage.out
          if-no-files-found: ignore
          retention-days: 7

  arm64-runtime:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test on native ARM64
        run: |
          go test ./... -count=1
          go test -race ./... -count=1
      - name: End-to-end on native ARM64
        env:
          WORLDBISECT_E2E_RACE: "1"
        run: timeout --foreground 120s ./scripts/e2e.sh
      - name: Package and execute ARM64 release binary
        run: |
          make release
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          archive="dist/worldbisect_$(cat VERSION)_linux_arm64.tar.gz"
          tar -xzf "$archive" -C "$tmp"
          root="$tmp/worldbisect_$(cat VERSION)_linux_arm64"
          "$root/bin/worldbisect" version
          "$root/bin/worldbisectd" version
