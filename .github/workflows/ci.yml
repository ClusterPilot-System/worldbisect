name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Published release version to consume in the release E2E job
        required: false
        default: '1.2.0'
        type: string
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify modules
        run: go mod verify
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Race detector
        run: go test -race ./... -count=1
      - name: Team hub publisher and browser scripts
        run: |
          python3 -m unittest discover -s scripts -p 'test_publish_hub_report.py'
          node --check web/hub/app.js
          node --test web/hub/app.test.js
          make build-hub
      - name: End-to-end
        env:
          WORLDBISECT_E2E_RACE: "1"
          WORLDBISECT_E2E_ARTIFACT_DIR: build/diagnostics
        run: timeout --foreground 120s ./scripts/e2e.sh
      - name: Team hub end-to-end with engine report
        run: python3 scripts/hub-e2e.py --report build/diagnostics/analysis.json
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/worldbisect-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/worldbisect-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Team hub browser interactions
        run: NODE_PATH="$RUNNER_TEMP/worldbisect-browser/node_modules" node web/hub/browser-check.cjs
      - name: Upload hub browser screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worldbisect-hub-browser
          path: build/hub-browser
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worldbisect-diagnostic-reports
          path: build/diagnostics
          if-no-files-found: ignore
          retention-days: 7
      - name: Release gate
        run: make check
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worldbisect-ci-failure
          path: |
            build/
            coverage.out
          if-no-files-found: ignore
          retention-days: 7

  upload-diagnostic-sarif:
    if: github.event_name != 'pull_request' && needs.validate.result == 'success'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository for Code Scanning context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download diagnostic reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worldbisect-diagnostic-reports
          path: build/diagnostics
      - name: Prepare SARIF for Code Scanning
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("build/diagnostics/analysis.sarif")
          target = Path("build/diagnostics/github-code-scanning.sarif")
          document = json.loads(source.read_text(encoding="utf-8"))
          for run in document.get("runs", []):
              for result in run.get("results", []):
                  # WorldBisect's canonical location identifies an analysis, not
                  # a source file. Code Scanning requires a relative/file URI and
                  # at least one location, so point the upload projection at the
                  # generated diagnostic artifact while keeping the canonical
                  # SARIF unchanged.
                  result["locations"] = [{
                      "physicalLocation": {
                          "artifactLocation": {"uri": "build/diagnostics/analysis.sarif"},
                          "region": {"startLine": 1},
                      }
                  }]
          target.write_text(json.dumps(document, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload SARIF findings
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: build/diagnostics/github-code-scanning.sarif

  release-consumption:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout release E2E harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Consume published release package
        env:
          WORLDBISECT_RELEASE_VERSION: ${{ inputs.release_version || '1.2.0' }}
        run: ./scripts/release-e2e.sh

  arm64-runtime:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test on native ARM64
        run: |
          go test ./... -count=1
          go test -race ./... -count=1
      - name: CI baseline contracts on ARM64
        run: ./scripts/ci-baseline-test.sh
      - name: End-to-end on native ARM64
        env:
          WORLDBISECT_E2E_RACE: "1"
        run: timeout --foreground 120s ./scripts/e2e.sh
      - name: Package and execute ARM64 release binary
        run: |
          make release
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          archive="dist/worldbisect_$(cat VERSION)_linux_arm64.tar.gz"
          tar -xzf "$archive" -C "$tmp"
          root="$tmp/worldbisect_$(cat VERSION)_linux_arm64"
          "$root/bin/worldbisect" version
          "$root/bin/worldbisectd" version
