name: Materialize verified source staging tree

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-staging-tree.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worldbisect-source-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPOSITORY: ClusterPilot-System/worldbisect
      TREE_SHA: 8c586a83c9a680664920d5734dc3bec9f3d82537
      TARGET_REF: refs/heads/agent/full-source-staging
    steps:
      - name: Create commit and staging reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          commit_payload=$(jq -n \
            --arg message "Materialize complete WorldBisect source for verification" \
            --arg tree "${TREE_SHA}" \
            --arg parent "${GITHUB_SHA}" \
            '{message:$message,tree:$tree,parents:[$parent]}')
          commit_sha=$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/commits" \
            -d "${commit_payload}" | jq -er '.sha')
          ref_payload=$(jq -n --arg ref "${TARGET_REF}" --arg sha "${commit_sha}" '{ref:$ref,sha:$sha}')
          status=$(curl --silent --show-error -o /tmp/ref-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/refs" \
            -d "${ref_payload}")
          if [[ "${status}" == "422" ]]; then
            update_payload=$(jq -n --arg sha "${commit_sha}" '{sha:$sha,force:true}')
            curl --fail-with-body --silent --show-error \
              -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/git/refs/heads/agent/full-source-staging" \
              -d "${update_payload}" >/dev/null
          elif [[ "${status}" != "201" ]]; then
            cat /tmp/ref-response.json >&2
            exit 1
          fi
          echo "Created ${TARGET_REF} at ${commit_sha}"
