name: Promote complete WorldBisect source and release v1.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-staging-release.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write

concurrency:
  group: worldbisect-v1-promotion
  cancel-in-progress: false

jobs:
  verify-promote-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPOSITORY: ClusterPilot-System/worldbisect
      STAGING_BRANCH: agent/full-source-staging
      RELEASE_TAG: v1.0.0
      SOURCE_DATE_EPOCH: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout staged complete source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.STAGING_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Normalize executable source scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh scripts/*.py examples/*/*.sh packaging/debian/postinst

      - name: Verify complete repository structure
        shell: bash
        run: |
          set -Eeuo pipefail
          required=(
            README.md LICENSE NOTICE SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md
            GOVERNANCE.md MAINTAINERS.md CHANGELOG.md VERSION go.mod Makefile
            api/openapi.yaml docs/ARCHITECTURE.md docs/USER_GUIDE.md
            cmd/worldbisect/main.go cmd/worldbisectd/main.go
            internal/api/server.go internal/capture/capture.go internal/experiment/engine.go
            internal/store/store.go internal/runner/runner.go web/index.html
          )
          for path in "${required[@]}"; do
            test -f "${path}" || { echo "missing required file: ${path}" >&2; exit 1; }
          done
          count=$(find . -type f ! -path './.git/*' | wc -l)
          test "${count}" -ge 120 || { echo "repository is incomplete: ${count} files" >&2; exit 1; }
          test ! -e .bootstrap
          test ! -e .bootstrap-exact

      - name: Formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Unit and integration tests
        run: go test ./... -count=1

      - name: Race detector
        run: timeout --foreground 600s go test -race ./... -count=1

      - name: End-to-end tests
        run: timeout --foreground 300s make e2e

      - name: Build deterministic release
        run: timeout --foreground 900s make release

      - name: Verify release checksums and archive safety
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          for archive in dist/*.tar.gz; do
            if tar -tzf "${archive}" | grep -Eq '(^|/)\.\.(/|$)|^/'; then
              echo "unsafe archive path: ${archive}" >&2
              exit 1
            fi
          done

      - name: Commit normalized complete source
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Normalize complete WorldBisect v1.0.0 source"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Promote verified source to main
        shell: bash
        run: |
          set -Eeuo pipefail
          sha='${{ steps.source.outputs.sha }}'
          payload=$(jq -n --arg sha "${sha}" '{sha:$sha,force:true}')
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/main" \
            -d "${payload}" >/dev/null

      - name: Create or replace annotated v1.0.0 tag
        shell: bash
        run: |
          set -Eeuo pipefail
          sha='${{ steps.source.outputs.sha }}'
          existing=$(gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null || true)
          if [[ -n "${existing}" && "${existing}" != "${sha}" ]]; then
            echo "release tag already points to another object" >&2
            exit 1
          fi
          if [[ -z "${existing}" ]]; then
            tag_payload=$(jq -n \
              --arg tag "${RELEASE_TAG}" \
              --arg message "WorldBisect v1.0.0" \
              --arg object "${sha}" \
              '{tag:$tag,message:$message,object:$object,type:"commit"}')
            tag_sha=$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/tags" \
              -d "${tag_payload}" | jq -er '.sha')
            ref_payload=$(jq -n --arg ref "refs/tags/${RELEASE_TAG}" --arg sha "${tag_sha}" '{ref:$ref,sha:$sha}')
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs" \
              -d "${ref_payload}" >/dev/null
          fi

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<'NOTES'
          # WorldBisect v1.0.0

          Initial public Apache-2.0 release.

          WorldBisect captures good and bad Linux command executions, isolates supported runtime differences through bounded counterfactual experiments, verifies the cause in both directions, and emits signed causal certificates.

          Review `README.md`, `docs/USER_GUIDE.md`, `docs/ARCHITECTURE.md`, `SECURITY.md`, `CHANGELOG.md`, and the SPDX SBOM before deployment.
          NOTES
          if gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --repo "${REPOSITORY}" --clobber
            gh release edit "${RELEASE_TAG}" --repo "${REPOSITORY}" \
              --title "WorldBisect v1.0.0" --notes-file /tmp/release-notes.md --draft=false --prerelease=false
          else
            gh release create "${RELEASE_TAG}" dist/* --repo "${REPOSITORY}" \
              --title "WorldBisect v1.0.0" --notes-file /tmp/release-notes.md --verify-tag
          fi

      - name: Configure public repository metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n '{
            description:"Git bisect for runtime reality: prove the smallest runtime factor set that makes a Linux command fail.",
            homepage:"https://github.com/ClusterPilot-System/worldbisect",
            has_issues:true,
            has_projects:false,
            has_wiki:false,
            has_discussions:true,
            allow_squash_merge:true,
            allow_merge_commit:false,
            allow_rebase_merge:false,
            allow_auto_merge:true,
            delete_branch_on_merge:true,
            allow_update_branch:true,
            web_commit_signoff_required:true
          }' | gh api --method PATCH "repos/${REPOSITORY}" --input - >/dev/null
          jq -n '{names:["linux","debugging","causal-inference","delta-debugging","reproducibility","devtools","observability","go","open-source","runtime-analysis"]}' \
            | gh api --method PUT "repos/${REPOSITORY}/topics" --input - >/dev/null
          gh api --method PUT "repos/${REPOSITORY}/vulnerability-alerts" >/dev/null || true
          gh api --method PUT "repos/${REPOSITORY}/automated-security-fixes" >/dev/null || true

      - name: Remove staging branch
        if: success()
        shell: bash
        run: |
          gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/agent/full-source-staging" >/dev/null || true
